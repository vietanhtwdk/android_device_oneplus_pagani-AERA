name: Build AERA (pagani)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: "AERA manifest branch"
        required: true
        default: "aera-16.0"
      DEVICE_TREE_BRANCH:
        description: "Branch of this device tree"
        required: true
        default: "aera-16.0"
      RECOVERY_SOURCE_URL:
        description: "bootable/recovery override (empty = use the manifest's AERA source)"
        required: false
        default: "https://github.com/vietanhtwdk/android_bootable_recovery"
      RECOVERY_SOURCE_BRANCH:
        description: "bootable/recovery override branch"
        required: false
        default: "aera-16.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Set up tools
        run: |
          sudo apt-get update
          sudo apt-get install -y repo git-lfs ccache
          sudo apt-get clean
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      # The Ubuntu 26 image has one ~145 GB root disk. maximize-build-space
      # filled it completely with its loop volumes, so free space on / directly
      # and build there instead.
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift /opt/microsoft
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon /swapfile
          sudo mkdir -p /home/runner/aera
          sudo chown runner:runner /home/runner/aera
          free -h
          df -h /

      - name: Sync AERA source
        working-directory: /home/runner/aera
        run: |
          repo init -u https://github.com/AERA-Recovery/android_manifest.git \
            -b "${{ inputs.MANIFEST_BRANCH }}" --depth=1 --no-use-superproject \
            --git-lfs
          repo sync -c --force-sync --no-clone-bundle --no-tags --optimized-fetch \
            -j"$(nproc)"
          df -h . /

      - name: Add device tree
        working-directory: /home/runner/aera
        run: |
          git clone --depth=1 -b "${{ inputs.DEVICE_TREE_BRANCH }}" \
            "https://github.com/${{ github.repository }}" device/oneplus/pagani

      - name: Override bootable/recovery
        if: ${{ inputs.RECOVERY_SOURCE_URL != '' }}
        working-directory: /home/runner/aera
        run: |
          rm -rf bootable/recovery
          git clone --depth=1 -b "${{ inputs.RECOVERY_SOURCE_BRANCH }}" \
            "${{ inputs.RECOVERY_SOURCE_URL }}" bootable/recovery

      - name: Build recovery image
        working-directory: /home/runner/aera
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1 CCACHE_EXEC="$(command -v ccache)"
          export CCACHE_DIR=/home/runner/aera/.ccache CCACHE_MAXSIZE=8G
          lunch twrp_pagani-bp2a-eng
          # 16 GB runners: Soong analysis + parallel clang can exhaust RAM and
          # kill the runner, so cap parallelism and log memory periodically.
          (while true; do echo "[mem] $(date +%T) $(free -m | awk '/Mem/{print $3"/"$2" MB"}') swap $(free -m | awk '/Swap/{print $3"/"$2" MB"}')"; sleep 60; done) &
          MON=$!
          m -j4 adbd recoveryimage
          kill $MON
          ls -la out/target/product/pagani/

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pagani-${{ github.run_id }}
          name: AERA pagani ${{ github.run_id }}
          prerelease: true
          files: |
            /home/runner/aera/out/target/product/pagani/recovery.img
            /home/runner/aera/out/target/product/pagani/AERA*.zip
          fail_on_unmatched_files: false
